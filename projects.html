
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warriorsapt — Projects</title>
  <meta name="description" content="Projects by WWarriorsapt — auto-fetched from GitHub." />
  <style>
    :root{
      --bg:#050507;
      --accent:#00ff7b;
      --muted:#9aa0a6;
      --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;padding:0;
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background:#050507;
      color:#e6eef2;
    }
    header{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.05)}
    h1{font-family:var(--mono);color:var(--accent)}
    main{max-width:1100px;margin:0 auto;padding:20px}
    .loader{text-align:center;font-family:var(--mono);color:var(--accent);margin-top:50px;animation:blink 1s infinite alternate}
    @keyframes blink{to{opacity:.2}}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
    .card{background:rgba(255,255,255,0.03);padding:18px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);transition:all 0.3s ease}
    .card:hover{transform:translateY(-3px);border-color:rgba(0,255,123,0.1)}
    .card h2{margin:0 0 8px 0;font-family:var(--mono);font-size:16px;color:var(--accent)}
    .card p{margin:0 0 8px 0;color:var(--muted);font-size:14px;min-height:40px}
    .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
    a{color:var(--accent);text-decoration:none;transition:all 0.2s ease}
    a:hover{text-decoration:underline;color:#00d17a}
    footer{text-align:center;margin-top:40px;color:var(--muted);font-size:13px;padding:20px 0;border-top:1px solid rgba(255,255,255,0.05)}

    /* Focus styles */
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Warrior's GitHub Projects</h1>
    <p style="color:var(--muted)">Auto-fetched live from <a href="https://github.com/warriorsapt-dotcom" target="_blank" rel="noopener noreferrer">@warriorsapt</a></p>
  </header>

  <main>
    <div id="loader" class="loader">[ Fetching from GitHub... ]</div>
    <div id="projects" class="grid" style="display:none"></div>
    <div id="error" style="display:none;text-align:center;color:#ff6b6b;font-family:var(--mono);margin-top:50px"></div>
  </main>

  <footer>
    <a href="index.html" style="color:var(--accent)">← Back to Portfolio</a>
  </footer>

  <script>
    const user = 'warriorsapt-dotcom'; // GitHub username
    // const user = 'warriorsapt'; // --- IGNORE ---
    const container = document.getElementById('projects');
    const loader = document.getElementById('loader');
    const errorDiv = document.getElementById('error');

    fetch(`https://api.github.com/users/${user}/repos?sort=updated&per_page=20`)
      .then(r => {
        if (!r.ok) throw new Error('Failed to fetch repositories');
        return r.json();
      })
      .then(repos => {
        loader.style.display = 'none';
        container.style.display = 'grid';
        
        if (repos.length === 0) {
          errorDiv.style.display = 'block';
          errorDiv.textContent = 'No repositories found.';
          return;
        }
        
        repos.forEach(repo => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h2><a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a></h2>
            <p>${repo.description || 'No description provided.'}</p>
            <div class="meta">
              <span>${repo.language || 'N/A'}</span>
              <span>⭐ ${repo.stargazers_count}</span>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        loader.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = '⚠️ Failed to load projects. Try refreshing.';
        console.error(err);
      });
  </script>
</body>
</html>
